name: between_world
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.1
  cached_network_image: ^3.3.1
  dio: ^5.4.3
  google_fonts: ^6.2.1
  file_picker: ^8.0.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_pdfview: ^1.3.2
  flutter_heatmap_calendar: ^1.0.5
  archive: ^3.6.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  audioplayers: ^6.0.0
  audio_service: ^0.18.18
  just_audio: ^0.9.36
  epubx: ^4.0.0
  image: ^3.3.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  image_picker: ^1.2.4
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/img.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8F3E6"
  adaptive_icon_foreground: "assets/icons/img.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/img.png"
  min_sdk_android: 21

  # Android 8.0+ Adaptive Icons Configuration
  adaptive_icon_background: "#F8F3E6"  # Warm parchment background
  adaptive_icon_foreground: "assets/icons/img.png"

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#F8F3E6"
    theme_color: "#B45309"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/images/
